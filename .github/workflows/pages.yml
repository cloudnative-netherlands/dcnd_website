name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time. Queued runs wait instead of cancelling,
# so a deployment already in flight is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Gatsby site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run analytics tests
        run: npm run test:analytics

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          # `gatsby build` reads PREFIX_PATHS; gatsby-config.js reads PATH_PREFIX.
          # actions/configure-pages reports "/dcnd_website" while the site is on
          # the repository URL and "/" once the custom domain is active, so the
          # same build works in both states without a hard-coded prefix.
          PREFIX_PATHS: 'true'
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          GATSBY_DEFAULT_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Public GTM container ID, supplied as a repository variable.
          # Unset simply means the deployed site ships without GTM/GA4.
          GATSBY_GTM_ID: ${{ vars.GATSBY_GTM_ID }}
        run: npm run build

      - name: Verify build output
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          # Generated Gatsby routes plus the frozen 2025 archive that is served
          # from static/. A missing file here means a broken deployment, so fail
          # before the artifact is uploaded.
          required_files="
            public/index.html
            public/agenda/index.html
            public/program/index.html
            public/schedule/index.html
            public/speakers/index.html
            public/workshops/index.html
            public/team/index.html
            public/vision/index.html
            public/privacy/index.html
            public/conduct/index.html
            public/404.html
            public/sitemap-index.xml
            public/manifest.webmanifest
            public/2025/index.html
            public/2025/schedule/index.html
          "

          missing=0
          for file in $required_files; do
            if test -f "$file"; then
              echo "ok       $file"
            else
              echo "::error::Missing expected build output: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # Fonts live in static/ and are referenced from the HTML template, so
          # they are the canary for path-prefix handling.
          case "${BASE_PATH:-/}" in
            "" | "/")
              if grep -q 'href="/dcnd_website/' public/index.html; then
                echo "::error::Build is serving from / but still emits /dcnd_website links"
                exit 1
              fi
              ;;
            *)
              prefix="${BASE_PATH%/}"
              if ! grep -q "href=\"${prefix}/fonts/" public/index.html; then
                echo "::error::Build is serving from ${prefix} but assets are not prefixed"
                exit 1
              fi
              ;;
          esac

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
